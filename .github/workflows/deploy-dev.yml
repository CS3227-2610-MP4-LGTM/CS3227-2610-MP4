name: Deploy development

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-development
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: development
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Verify Bun version matches packageManager
        run: test "bun@$(bun --version)" = "$(node -p "require('./package.json').packageManager")"
      - run: bun install --frozen-lockfile
      - name: Apply development migrations
        if: ${{ hashFiles('supabase/migrations/**/*.sql') != '' }}
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: bunx supabase db push --remote="$SUPABASE_DB_URL" --include-all --dry-run
      - name: Pull Vercel Preview environment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: bunx vercel@65.11.0 pull --yes --environment=preview
      - name: Build Preview deployment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: bunx vercel@65.11.0 build
      - name: Deploy Preview build
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: bunx vercel@65.11.0 deploy --prebuilt --yes > "$RUNNER_TEMP/deployment-url.txt"
      - name: Alias development deployment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          deployment_url=$(cat "$RUNNER_TEMP/deployment-url.txt")
          deployment_host="${deployment_url#https://}"
          printf 'header = "Authorization: Bearer %s"\n' "$VERCEL_TOKEN" | \
            curl --config - --fail-with-body --silent --show-error \
              --request POST \
              --url "https://api.vercel.com/v2/deployments/$deployment_host/aliases?teamId=$VERCEL_ORG_ID" \
              --header 'Content-Type: application/json' \
              --data '{"alias":"lgtm-cs3227-dev.vercel.app"}'
