name: Deploy production

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require tagged commit to be reachable from master
        run: |
          git merge-base --is-ancestor 'HEAD^{commit}' refs/remotes/origin/master || {
            echo "::error::The tagged commit must be reachable from master."
            exit 1
          }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Verify Bun version matches packageManager
        run: test "bun@$(bun --version)" = "$(node -p "require('./package.json').packageManager")"
      - run: bun install --frozen-lockfile
      - name: Apply production migrations
        if: ${{ hashFiles('supabase/migrations/**/*.sql') != '' }}
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: bunx supabase db push --remote="$SUPABASE_DB_URL" --yes
      - name: Pull Vercel Production environment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: bunx vercel@65.11.0 pull --yes --environment=production
      - name: Build Production deployment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: bunx vercel@65.11.0 build --prod
      - name: Deploy Production build
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: bunx vercel@65.11.0 deploy --prebuilt --prod --yes
